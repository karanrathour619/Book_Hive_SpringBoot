# Server
server.port=${PORT:5000}

# Database Configuration (Defaults to persistent H2 locally, or PostgreSQL in cloud via SPRING_DATASOURCE_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/bookhive;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (available at /h2-console when running locally)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate (auto creates/updates tables in both H2 and PostgreSQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (supports override via JWT_SECRET in production)
jwt.secret=${JWT_SECRET:bookhive-super-secret-jwt-key-change-this-in-production-must-be-256-bits}
jwt.expiration=3600000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JSON: ISO-8601 date strings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false

# Uploads directory
app.uploads.dir=uploads
