# Server
server.port=${PORT:5000}

# Cloud PostgreSQL Database Configuration (Neon.tech)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-plain-king-b8spz2rp-pooler.c-14.us-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_y4AjV9xXgaWN}

# JPA / Hibernate for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:bookhive-super-secret-jwt-key-change-this-in-production-must-be-256-bits}
jwt.expiration=3600000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JSON: ISO-8601 date strings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false

# Uploads directory
app.uploads.dir=uploads
